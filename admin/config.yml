backend:
  name: github
  repo: chipetagift85-dotcom/Psalmist-Gift
  branch: main

collections:
  - name: "blog"
    label: "Resources"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Sermons", "Articles", "Devotions", "Sacred Songs", "Academic Papers"]}
      - {label: "Media / File Upload", name: "media_file", widget: "file", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "profile"
        label: "Profile & Contact Info"
        file: "content/settings/profile.json"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Profile Image", name: "profile_image", widget: "image"}
          - {label: "Bio", name: "bio", widget: "text", required: false}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "WhatsApp", name: "whatsapp", widget: "string"}
          - {label: "Facebook Name", name: "facebook", widget: "string"}
