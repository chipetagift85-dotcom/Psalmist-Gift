<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psalmist Gift</title>
  <!-- Marked Library to render Markdown content -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #222; background: #fafafa; line-height: 1.6; }
    header { text-align: center; padding: 30px 0; border-bottom: 2px solid #eee; margin-bottom: 30px; }
    h1 { margin: 0; color: #111; font-size: 2.2rem; }
    p.tagline { color: #666; margin-top: 5px; }
    .post { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 30px; border: 1px solid #eee; }
    .post h2 { margin-top: 0; color: #1a252f; }
    .post-date { font-size: 0.85rem; color: #888; margin-bottom: 15px; }
    audio { width: 100%; margin: 15px 0; }
    .download-btn { display: inline-block; background: #2563eb; color: #fff; padding: 10px 18px; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 0.9rem; margin-top: 10px; }
    .download-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <h1>Psalmist Gift</h1>
    <p class="tagline">Audio Messages, Sermons & Songs</p>
  </header>

  <main id="posts-container">
    <p style="text-align: center; color: #666;">Loading latest posts...</p>
  </main>

  <script>
    async function fetchPosts() {
      const container = document.getElementById('posts-container');
      try {
        // Fetch files list from GitHub API for content/blog
        const response = await fetch('https://api.github.com/repos/chipetagift85-dotcom/Psalmist-Gift/contents/content/blog');
        const files = await response.json();

        if (!Array.isArray(files) || files.length === 0) {
          container.innerHTML = '<p style="text-align: center;">No posts published yet.</p>';
          return;
        }

        container.innerHTML = ''; // Clear loading text

        // Reverse array to show newest posts first
        for (const file of files.reverse()) {
          if (file.name.endsWith('.md')) {
            const res = await fetch(file.download_url);
            const markdownText = await res.text();

            // Extract Frontmatter and Body
            const parts = markdownText.split('---');
            let body = parts.slice(2).join('---').trim();
            const headerLines = parts[1] ? parts[1].split('\n') : [];

            let title = file.name.replace('.md', '');
            let date = '';
            let audioFile = '';

            headerLines.forEach(line => {
              if (line.startsWith('title:')) title = line.replace('title:', '').trim().replace(/^"(.*)"$/, '$1');
              if (line.startsWith('date:')) date = line.replace('date:', '').trim().substring(0, 10);
              if (line.startsWith('audio:')) audioFile = line.replace('audio:', '').trim().replace(/^"(.*)"$/, '$1');
              if (line.startsWith('file_upload:')) audioFile = line.replace('file_upload:', '').trim().replace(/^"(.*)"$/, '$1');
            });

            // Create Post Element
            const postCard = document.createElement('article');
            postCard.className = 'post';

            let audioHTML = '';
            if (audioFile) {
              audioHTML = `
                <audio controls preload="metadata">
                  <source src="${audioFile}" type="audio/mpeg">
                  Your browser does not support the audio element.
                </audio>
                <a href="${audioFile}" download class="download-btn">🎧 Download Audio</a>
              `;
            }

            postCard.innerHTML = `
              <h2>${title}</h2>
              ${date ? `<div class="post-date">Published on ${date}</div>` : ''}
              ${audioHTML}
              <div class="post-body">${marked.parse(body)}</div>
            `;

            container.appendChild(postCard);
          }
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="text-align: center; color: red;">Failed to load posts. Please try again later.</p>';
      }
    }

    fetchPosts();
  </script>

</body>
</html>
